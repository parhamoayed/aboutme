
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Links</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #101010;
            color: #ffffff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            text-align: center;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #53fc18;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #999;
            font-size: 14px;
            margin-bottom: 35px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link {
            display: block;
            text-decoration: none;
            color: #ffffff;
            background: #1c1c1c;
            border: 1px solid #333;
            padding: 17px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            transition: 0.25s;
        }

        .link:hover {
            background: #53fc18;
            color: #101010;
            border-color: #53fc18;
            transform: translateY(-3px);
        }

        footer {
            margin-top: 40px;
            color: #666;
            font-size: 12px;
        }

        footer span {
            color: #53fc18;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>MY LINKS</h1>
        <p class="subtitle">Find me on other platforms</p>

        <div class="links">

            <a href="https://kick.com/" class="link" target="_blank">
                Kick
            </a>

            <a href="https://youtube.com/" class="link" target="_blank">
                YouTube
            </a>

            <a href="https://instagram.com/" class="link" target="_blank">
                Instagram
            </a>

            <a href="https://t.me/" class="link" target="_blank">
                Telegram
            </a>

            <a href="https://discord.com/" class="link" target="_blank">
                Discord
            </a>

        </div>

        <footer>
            Powered by <span>Green</span>
        </footer>

    </main>

</body>
</html>
